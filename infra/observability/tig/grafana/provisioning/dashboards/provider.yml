apiVersion: 1

providers:
  - name: 'EcomFlow TIG'
    orgId: 1
    folder: 'EcomFlow'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json/ecomflow
      foldersFromFilesStructure: false

  - name: 'StockFlow TIG'
    orgId: 1
    folder: 'StockFlow'
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json/stockflow
      foldersFromFilesStructure: false
