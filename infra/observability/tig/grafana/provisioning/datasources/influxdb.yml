apiVersion: 1

datasources:
  # ---- EcomFlow Datasource (existing) ----
  - name: InfluxDB-EcomFlow
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: ${INFLUXDB_BUCKET}
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
    isDefault: true
    editable: false
    version: 1

  # ---- StockFlow Datasource (NEW) ----
  - name: InfluxDB-StockFlow
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ecomflow
      defaultBucket: stockflow_metrics
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
    isDefault: false
    editable: false
    version: 1
