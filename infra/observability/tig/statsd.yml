# ============================================================
# EcomFlow Observability - StatsD Input Configuration
# ============================================================
# Purpose:
#   Receive Airflow metrics via StatsD protocol over UDP.
#
# Architecture:
#
#   Airflow
#      │
#      │ UDP :8125 (StatsD protocol)
#      ▼
#   Telegraf StatsD Input (this file)
#      │
#      ├── Receives & parses StatsD metrics
#      ├── Aggregates counters/gauges/timers
#      └── Forwards to Telegraf processing pipeline
#
# IMPORTANT:
#   - This is NOT a standalone StatsD daemon configuration.
#   - This configures Telegraf's built-in StatsD input plugin.
#   - Metric processing, filtering, and InfluxDB output are
#     configured separately in telegraf.yml.
#
# Responsibility Boundary:
#   ✓ Receive UDP packets on port 8125
#   ✓ Parse StatsD protocol (counters, gauges, timers, sets)
#   ✓ Calculate percentiles for timer metrics
#   ✓ Maintain metric state between flush intervals
#   ✗ Metric filtering/dropping (telegraf.yml)
#   ✗ Metric renaming/transformation (telegraf.yml)
#   ✗ InfluxDB output (telegraf.yml)
# ============================================================

[[inputs.statsd]]

  # ----------------------------------------------------------
  # Network Configuration
  # ----------------------------------------------------------
  # Listen for StatsD metrics on UDP port 8125.
  # Airflow will send metrics to this endpoint.
  #
  # Format: "<host>:<port>"
  # - Empty host (":8125") means listen on all interfaces
  # - Recommended for Docker/containerized deployments
  service_address = ":8125"

  # Protocol: UDP (StatsD standard)
  # - No connection handshake
  # - Fire-and-forget delivery
  # - Metrics may be lost under network stress
  # - Acceptable trade-off for observability use case


  # ----------------------------------------------------------
  # Metric Parsing
  # ----------------------------------------------------------
  # How to split metric names into components.
  #
  # Airflow metric format:
  #   airflow.scheduler.heartbeat
  #   airflow.dag.processing.total_parse_time
  #   airflow.task_instance_created-<operator>
  #
  # Components are separated by periods (".").
  # This matches Airflow's default StatsD naming convention.
  metric_separator = "."

  # DataDog extensions: DISABLED
  # Airflow uses standard StatsD protocol, not DataDog-specific
  # extensions (e.g., histogram type, service checks).
<<<<<<< HEAD
=======
