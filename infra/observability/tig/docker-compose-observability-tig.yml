# ============================================================
# EcomFlow TIG Observability Stack - Unified Docker Compose
# ============================================================
# Purpose:
#   Orchestrate the complete Telegraf-InfluxDB-Grafana (TIG)
#   observability stack for Airflow metrics monitoring.
#
# Architecture:
#
#   Airflow (external)
#      ↓ UDP :8125 (StatsD protocol)
#   Telegraf (this file)
#      ↓ HTTP POST :8086 (InfluxDB Line Protocol)
#   InfluxDB (this file)
#      ↓ HTTP GET :8086 (Flux query language)
#   Grafana (this file)
#      ↓ Dashboards & Alerts
#
# Services:
#   1. influxdb  - Time-series database (port 8086)
#   2. telegraf  - Metrics collector & processor (port 8125/UDP)
#   3. grafana   - Visualization & alerting (port 3001)
#
# Usage:
#   # Start all services
#   docker-compose up -d
#
#   # View logs
#   docker-compose logs -f
#
#   # Stop all services
#   docker-compose down
#
#   # Stop and remove volumes (DATA LOSS!)
#   docker-compose down -v
#
# Prerequisites:
#   1. Create .env file with required credentials
#   2. Ensure telegraf.yml and statsd.yml exist
#   3. Ensure grafana/provisioning/ directory exists
#
# Environment Variables (from .env):
#   - GRAFANA_ADMIN_USER
#   - GRAFANA_ADMIN_PASSWORD
#   - INFLUXDB_USERNAME
#   - INFLUXDB_PASSWORD
#   - INFLUXDB_ORG
#   - INFLUXDB_BUCKET
#   - INFLUXDB_TOKEN
# ============================================================


services:

  # ==========================================================
  # InfluxDB - Time-Series Database
  # ==========================================================
  influxdb:
    image: influxdb:2.7
    container_name: ecomflow-influxdb

    ports:
      - "8086:8086"

    environment:
      # Auto-initialization on first start
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}

    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

    networks:
      - ecomflow-observability

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # ==========================================================
  # Telegraf - Metrics Collector & Processor
  # ==========================================================
  telegraf:
    image: telegraf:latest
    container_name: ecomflow-telegraf

    # Expose StatsD port for Airflow metrics
    ports:
      - "8125:8125/udp"

    environment:
      # InfluxDB connection parameters
      # These are substituted into telegraf.yml at runtime
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}

    volumes:
      # Mount Telegraf configuration files
      # telegraf.yml = main config (agent, outputs, processors)
      # statsd.yml = StatsD input plugin config
      - ./telegraf.yml:/etc/telegraf/telegraf.conf:ro
      - ./statsd.yml:/etc/telegraf/telegraf.d/statsd.conf:ro

    networks:
      - ecomflow-observability

    # Wait for InfluxDB to be ready before starting
    depends_on:
      influxdb:
        condition: service_healthy

    restart: unless-stopped


  # ==========================================================
  # Grafana - Visualization & Alerting
  # ==========================================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ecomflow-grafana

    ports:
      - "3001:3000"

    environment:
      # Grafana admin credentials
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

      # InfluxDB datasource configuration
      # Substituted into provisioning/datasources/influxdb.yml
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}

    volumes:
      # Persistent Grafana data (dashboards, users, settings)
      - grafana_data:/var/lib/grafana
      # Auto-provision datasources and dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    networks:
      - ecomflow-observability

    # Wait for InfluxDB to be ready before starting
    depends_on:
      influxdb:
        condition: service_healthy

    restart: unless-stopped


# ==========================================================
# Docker Networks
# ==========================================================
networks:
  ecomflow-observability:
    name: ecomflow-observability
    driver: bridge


# ==========================================================
# Docker Volumes
# ==========================================================
volumes:
  
  # InfluxDB persistent storage
  influxdb_data:
    name: ecomflow-influxdb-data
  
  influxdb_config:
    name: ecomflow-influxdb-config
  
  # Grafana persistent storage
  grafana_data:
    name: ecomflow-grafana-data
