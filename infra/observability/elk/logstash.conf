input {
  # 1. Open port 5044 to receive logs from Filebeat
  beats {
    port => 5044
  }
}

filter {
  # 2. Process Airflow logs
  if [fields][log_source] == "airflow" {
    grok {
      match => { 
        "message" => "\[%{TIMESTAMP_ISO8601:log_timestamp}\] \{%{DATA:logger}\} %{LOGLEVEL:log_level} - %{GREEDYDATA:log_message}" 
      }
    }
    date {
      match => [ "log_timestamp", "yyyy-MM-dd HH:mm:ss,SSS" ]
      target => "@timestamp"
    }
  }
}

output {
  # 3. Write to Elasticsearch with appropriate index name
  elasticsearch {
    hosts => ["http://ecomflow-elasticsearch:9200"]
    index => "airflow-logs-%{+YYYY.MM.dd}"
  }
  
  # Debug: Output to stdout to check if logstash receives logs
  stdout {
    codec => rubydebug
  }
}
