# ============================================================
# LOGSTASH - ECOMFLOW
# ============================================================
#
# Purpose:
#   Central processing layer for EcomFlow observability logs.
#
# Flow:
#   Airflow logs
#       → Filebeat
#       → Logstash
#       → Elasticsearch
#       → Kibana
#
# Responsibility:
#   - Receive logs from Filebeat
#   - Parse and normalize Airflow log events
#   - Enrich logs with useful metadata
#   - Filter unnecessary events
#   - Forward processed logs to Elasticsearch
#
# Design principle:
#   Filebeat = lightweight log shipper
#   Logstash = log processing / transformation
#   Elasticsearch = log storage & search
#   Kibana = visualization & investigation
#
# Keep this configuration simple and appropriate for EcomFlow.
# Do not turn Logstash into a general-purpose ETL engine.
#
# ============================================================


# ============================================================
# NODE / PIPELINE SETTINGS
# ============================================================
# Using Logstash defaults:
# - pipeline.workers: auto (number of CPU cores)
# - pipeline.batch.size: 125
# - pipeline.batch.delay: 50ms
#
# These defaults are appropriate for EcomFlow's scale.
# Persistent queue is intentionally disabled for simplicity.
# If Elasticsearch backpressure becomes an issue, enable it later.


# ============================================================
# INPUT
# ============================================================
# Receive logs from Filebeat via Beats protocol

input {
  beats {
    # Listen for Filebeat connections
    port => "${BEATS_PORT:5044}"
    
    # Client authentication (optional, for future TLS)
    # ssl => true
    # ssl_certificate => "/path/to/cert.crt"
    # ssl_key => "/path/to/cert.key"
    
    # Connection settings
    # Filebeat will retry automatically, so keep defaults
    client_inactivity_timeout => 300
  }
}


# ============================================================
# FILTER
# ============================================================
# Parse and enrich Airflow logs

filter {

  # --------------------------------------------------------
  # 1. Parse Airflow log format
  # --------------------------------------------------------
  # Airflow task logs typically follow:
  # [YYYY-MM-DD HH:MM:SS,mmm] {log_file_path} LEVEL - message
  # Example:
  # [2024-01-15 10:23:45,123] {taskinstance.py:1234} INFO - Task executed successfully
  
  grok {
    match => {
      "message" => "\[%{TIMESTAMP_ISO8601:airflow_timestamp}\] \{%{DATA:airflow_source_file}\} %{LOGLEVEL:log_level} - %{GREEDYDATA:log_message}"
    }
    
    # If grok fails, tag but don't drop the event
    # Preserves unparsed logs for debugging
    tag_on_failure => ["_grokparsefailure"]
  }

  # --------------------------------------------------------
  # 2. Parse timestamp
  # --------------------------------------------------------
  # Convert Airflow timestamp to @timestamp for Elasticsearch
  
  if [airflow_timestamp] {
    date {
      match => ["airflow_timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  # --------------------------------------------------------
  # 3. Extract DAG/Task information from log path
  # --------------------------------------------------------
  # Airflow log paths contain: dag_id/task_id/execution_date/try_number.log
  # Example: /logs/ecomflow_bronze/extract_data/2024-01-15T10:00:00+00:00/1.log
  
  if [log][file][path] {
    grok {
      match => {
        "[log][file][path]" => ".*/(?<dag_id>[^/]+)/(?<task_id>[^/]+)/(?<execution_date>[^/]+)/(?<try_number>\d+)\.log$"
      }
      tag_on_failure => ["_dag_path_parse_failure"]
    }
  }

  # --------------------------------------------------------
  # 4. Normalize log level
  # --------------------------------------------------------
  # Standardize log levels to lowercase for consistent querying
  
  if [log_level] {
    mutate {
      lowercase => ["log_level"]
    }
  }

  # --------------------------------------------------------
  # 5. Enrich with EcomFlow metadata
  # --------------------------------------------------------
  # Add project-specific context for Kibana filtering
  
  mutate {
    add_field => {
      "[ecomflow][project]" => "ecomflow"
      "[ecomflow][component]" => "airflow"
      "[ecomflow][environment]" => "${ENVIRONMENT:dev}"
      "[ecomflow][pipeline]" => "observability"
      "[ecomflow][log_type]" => "orchestration"
    }
  }

  # --------------------------------------------------------
  # 6. Identify log category
  # --------------------------------------------------------
  # Tag logs by type for easier Kibana filtering
  
  if [dag_id] =~ /bronze/ {
    mutate { add_field => { "[ecomflow][layer]" => "bronze" } }
  } else if [dag_id] =~ /silver/ {
    mutate { add_field => { "[ecomflow][layer]" => "silver" } }
  } else if [dag_id] =~ /gold/ {
    mutate { add_field => { "[ecomflow][layer]" => "gold" } }
  } else if [dag_id] =~ /master/ {
    mutate { add_field => { "[ecomflow][layer]" => "orchestration" } }
  }

  # --------------------------------------------------------
  # 7. Detect error/exception patterns
  # --------------------------------------------------------
  # Flag logs containing errors for alerting
  
  if [log_message] =~ /(?i)(error|exception|failed|traceback|fatal)/ {
    mutate {
      add_tag => ["error"]
      add_field => { "[ecomflow][severity]" => "high" }
    }
  } else if [log_level] == "warning" {
    mutate {
      add_field => { "[ecomflow][severity]" => "medium" }
    }
  } else {
    mutate {
      add_field => { "[ecomflow][severity]" => "low" }
    }
  }

  # --------------------------------------------------------
  # 8. Filter noise (optional)
  # --------------------------------------------------------
  # Drop genuinely useless events to reduce storage
  # Be conservative - when in doubt, keep it
  
  # Example: Drop Airflow heartbeat messages
  if [log_message] =~ /Heartbeat/ and [log_level] == "debug" {
    drop { }
  }

  # --------------------------------------------------------
  # 9. Preserve original message
  # --------------------------------------------------------
  # Keep raw message for debugging even after parsing
  # Already preserved as 'message' field by default
  
  mutate {
    copy => { "message" => "[original_message]" }
  }

  # --------------------------------------------------------
  # 10. Clean up temporary fields
  # --------------------------------------------------------
  # Remove fields not needed in Elasticsearch
  
  mutate {
    remove_field => ["[agent][ephemeral_id]", "[agent][id]"]
  }
}


# ============================================================
# OUTPUT
# ============================================================
# Send processed logs to Elasticsearch

output {

  # --------------------------------------------------------
  # Elasticsearch output
  # --------------------------------------------------------
  
  elasticsearch {
    # Connection
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
    
    # Authentication
    # Enable when Elasticsearch security is configured
    user => "${ELASTICSEARCH_USER:}"
    password => "${ELASTICSEARCH_PASSWORD:}"
    
    # Index strategy: time-based rolling indices
    # Pattern: ecomflow-logs-{environment}-YYYY.MM.dd
    # Example: ecomflow-logs-dev-2024.01.15
    index => "ecomflow-logs-%{[ecomflow][environment]}-%{+YYYY.MM.dd}"
    
    # Document ID: let Elasticsearch auto-generate
    # Prevents duplicate handling complexity
    
    # Pipeline: use Elasticsearch ingest pipeline if needed (future)
    # pipeline => "ecomflow-enrichment"
    
    # Performance tuning
    # Defaults are appropriate for EcomFlow scale
    # workers => 1
    # flush_size => 500
    # idle_flush_time => 5
  }

  # --------------------------------------------------------
  # Debug output (optional - disable in production)
  # --------------------------------------------------------
  # Uncomment for troubleshooting
  
  # stdout {
  #   codec => rubydebug {
  #     metadata => false
  #   }
  # }
}


# ============================================================
# ENVIRONMENT VARIABLES REFERENCE
# ============================================================
# The following environment variables are used:
#
# ${BEATS_PORT}               - Filebeat input port (default: 5044)
# ${ELASTICSEARCH_HOST}       - Elasticsearch hostname (default: elasticsearch)
# ${ELASTICSEARCH_PORT}       - Elasticsearch port (default: 9200)
# ${ELASTICSEARCH_USER}       - Elasticsearch username (required if auth enabled)
# ${ELASTICSEARCH_PASSWORD}   - Elasticsearch password (required if auth enabled)
# ${ENVIRONMENT}              - Deployment environment (dev/staging/prod)
#
# Set these in docker-compose.yml or .env file.
# NEVER hard-code credentials in this file.


# ============================================================
# ERROR / FAILURE HANDLING
# ============================================================
# Built-in resilience:
#
# 1. Filebeat disconnect:
#    - Logstash keeps running
#    - Filebeat automatically reconnects
#    - No data loss (Filebeat tracks position)
#
# 2. Elasticsearch unavailable:
#    - Logstash queues events in memory (default)
#    - Retries automatically
#    - Filebeat backpressure prevents overwhelming Logstash
#    - For production: enable persistent queue (logstash.yml)
#
# 3. Malformed logs:
#    - Grok failures are tagged with _grokparsefailure
#    - Events are NOT dropped
#    - Original message preserved for debugging
#    - Investigate via Kibana: tags:_grokparsefailure
#
# 4. Pipeline failures:
#    - Logstash logs errors to /var/log/logstash/
#    - Monitor via TIG stack (future)
#
# This configuration prioritizes reliability over complexity.


# ============================================================
# OBSERVABILITY
# ============================================================
# Logstash internal monitoring:
#
# 1. HTTP API (enabled by default)
#    - Stats: http://logstash:9600/_node/stats
#    - Health: http://logstash:9600/_node
#    - Pipeline: http://logstash:9600/_node/stats/pipelines
#
# 2. Future TIG integration:
#    - Telegraf can scrape Logstash metrics
#    - Send to InfluxDB
#    - Visualize in Grafana
#
# 3. Logs:
#    - Logstash logs to stdout (captured by Docker)
#    - Logs to /var/log/logstash/ (mount volume)
#
# Do NOT send Logstash logs through ELK pipeline.
# Use TIG stack for Logstash monitoring (future).


# ============================================================
# NOTES
# ============================================================

# EcomFlow observability architecture:
#
#             ┌─────────────┐
#             │   Airflow   │
#             └──────┬──────┘
#                    │
#             Airflow logs
#                    │
#                    ▼
#             ┌─────────────┐
#             │  Filebeat   │
#             └──────┬──────┘
#                    │
#                    ▼
#             ┌─────────────┐
#             │  Logstash   │
#             │   Process   │
#             └──────┬──────┘
#                    │
#                    ▼
#             ┌─────────────┐
#             │Elasticsearch│
#             └──────┬──────┘
#                    │
#                    ▼
#             ┌─────────────┐
#             │   Kibana    │
#             └─────────────┘
#
# ELK = Logs
# TIG = Metrics
# Alerting = Notification layer
# Maintenance = Long-term operational hygiene